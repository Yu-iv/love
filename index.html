<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topological Heart - High Detail</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .ui-overlay {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #ffffff;
            pointer-events: none;
            z-index: 10;
        }
        .ui-overlay h1 {
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-left: 2px solid #ffffff;
            padding-left: 10px;
            margin-bottom: 4px;
        }
        .ui-overlay p {
            font-size: 10px;
            color: #666666;
            letter-spacing: 1.5px;
            padding-left: 12px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="ui-overlay">
        <h1>Anatomical Topological Heart</h1>
        <p>HIGH-DENSITY MESH / MULTI-CHAMBER GEOMETRY</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const heartGroup = new THREE.Group();
        scene.add(heartGroup);

        // --- 共通線框與點陣材質 ---
        const wireframeMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            wireframe: true,
            transparent: true,
            opacity: 0.15
        });

        const pointsMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.02,
            transparent: true,
            opacity: 0.45
        });

        function createMeshAndPoints(geo, group) {
            const mesh = new THREE.Mesh(geo, wireframeMat);
            const points = new THREE.Points(geo, pointsMat);
            group.add(mesh);
            group.add(points);
        }

        // --- 1. 左心室 & 右心室 (主體結構 + 前/後室間溝) ---
        const ventricleGeo = new THREE.IcosahedronGeometry(2.3, 35);
        const vPos = ventricleGeo.attributes.position;
        const vVec = new THREE.Vector3();

        for (let i = 0; i < vPos.count; i++) {
            vVec.fromBufferAttribute(vPos, i);

            // 心尖拉長與偏置
            vVec.y *= 1.4;
            if (vVec.y < 0) {
                const taper = Math.max(0.15, 1 + vVec.y * 0.28);
                vVec.x *= taper;
                vVec.z *= taper;
                vVec.x -= (1 + vVec.y * 0.2) * 0.2; // 心尖朝左下傾斜
            }

            // 前室間溝 (Anterior Interventricular Sulcus) 幾何凹陷刻劃
            const angle = Math.atan2(vVec.z, vVec.x);
            if (angle > 0.2 && angle < 1.1 && vVec.y < 1.0) {
                const grooveDepth = Math.sin((angle - 0.2) / 0.9 * Math.PI) * 0.18;
                vVec.x *= (1 - grooveDepth);
                vVec.z *= (1 - grooveDepth);
            }

            // 心肌壁不對稱性 (左心室側較厚實)
            if (vVec.x < 0) {
                vVec.x *= 1.15;
            }

            vPos.setXYZ(i, vVec.x, vVec.y, vVec.z);
        }
        ventricleGeo.computeVertexNormals();
        createMeshAndPoints(ventricleGeo, heartGroup);

        // --- 2. 左心房 & 右心房 + 心耳特徵 (Atria & Auricles) ---
        const atriumGeo = new THREE.IcosahedronGeometry(1.3, 20);
        const aPos = atriumGeo.attributes.position;
        const aVec = new THREE.Vector3();

        for (let i = 0; i < aPos.count; i++) {
            aVec.fromBufferAttribute(aPos, i);
            aVec.x *= 1.3;
            aVec.z *= 0.9;
            // 心耳突起細節
            if (aVec.x < -0.5 && aVec.z > 0.2) {
                aVec.x -= 0.3;
                aVec.y += 0.2;
            }
            aPos.setXYZ(i, aVec.x, aVec.y, aVec.z);
        }
        atriumGeo.computeVertexNormals();
        const atriumGroup = new THREE.Group();
        atriumGroup.position.set(-0.2, 2.0, -0.2);
        createMeshAndPoints(atriumGeo, atriumGroup);
        heartGroup.add(atriumGroup);

        // --- 3. 主動脈弓 (Aortic Arch) 及三支分頭血管 ---
        const aortaPath = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-0.2, 1.8, 0.1),
            new THREE.Vector3(-0.3, 3.2, 0.2),
            new THREE.Vector3(-0.8, 3.8, -0.1),
            new THREE.Vector3(-1.3, 3.2, -0.5),
            new THREE.Vector3(-1.2, 1.0, -0.7)
        ]);
        const aortaGeo = new THREE.TubeGeometry(aortaPath, 32, 0.38, 16, false);
        createMeshAndPoints(aortaGeo, heartGroup);

        // 主動脈弓頂部的三支分支血管 (Brachiocephalic / Carotid / Subclavian)
        const branchOffsets = [-0.4, -0.7, -1.0];
        branchOffsets.forEach(xOffset => {
            const branchPath = new THREE.CatmullRomCurve3([
                new THREE.Vector3(xOffset, 3.6, 0.0),
                new THREE.Vector3(xOffset * 1.1, 4.4, 0.1)
            ]);
            const branchGeo = new THREE.TubeGeometry(branchPath, 10, 0.1, 10, false);
            createMeshAndPoints(branchGeo, heartGroup);
        });

        // --- 4. 肺動脈幹與左右肺動脈分叉 (Pulmonary Trunk & Branches) ---
        const pulmonaryPath = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0.3, 1.6, 0.5),
            new THREE.Vector3(0.2, 2.8, 0.3)
        ]);
        const pulmonaryGeo = new THREE.TubeGeometry(pulmonaryPath, 16, 0.32, 14, false);
        createMeshAndPoints(pulmonaryGeo, heartGroup);

        // 肺動脈分叉管道
        const leftPA = new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
            new THREE.Vector3(0.2, 2.8, 0.3),
            new THREE.Vector3(-0.9, 2.9, -0.4)
        ]), 12, 0.2, 10, false);
        createMeshAndPoints(leftPA, heartGroup);

        const rightPA = new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
            new THREE.Vector3(0.2, 2.8, 0.3),
            new THREE.Vector3(1.2, 2.7, -0.3)
        ]), 12, 0.2, 10, false);
        createMeshAndPoints(rightPA, heartGroup);

        // --- 5. 上下腔靜脈 (Vena Cava) ---
        const vcPath = new THREE.CatmullRomCurve3([
            new THREE.Vector3(1.2, 3.8, -0.4),
            new THREE.Vector3(1.1, 1.2, -0.4),
            new THREE.Vector3(0.9, -0.5, -0.3)
        ]);
        const vcGeo = new THREE.TubeGeometry(vcPath, 20, 0.28, 12, false);
        createMeshAndPoints(vcGeo, heartGroup);


        // --- 動畫與互動 ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            // 雙期心跳脈動
            const cycle = (t * 1.15) % 1.0;
            let scale = 1.0;
            if (cycle < 0.12) {
                scale = 1.0 + Math.sin(cycle / 0.12 * Math.PI) * 0.07;
            } else if (cycle > 0.18 && cycle < 0.3) {
                scale = 1.0 + Math.sin((cycle - 0.18) / 0.12 * Math.PI) * 0.035;
            }
            heartGroup.scale.set(scale, scale, scale);

            // 緩慢旋轉
            heartGroup.rotation.y = t * 0.22;
            heartGroup.rotation.x = Math.sin(t * 0.12) * 0.08;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
