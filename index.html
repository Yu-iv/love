<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topological Heart - Generative Wireframe Art</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background-color: #000000;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
    }

    .github-link {
      position: absolute;
      bottom: 20px;
      color: #ffffff;
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 2px;
      text-decoration: none;
      opacity: 0.5;
      transition: opacity 0.3s ease;
    }

    .github-link:hover {
      opacity: 1;
    }
  </style>
</head>
<body>

  <canvas id="topological-heart"></canvas>
  <a class="github-link" href="#" target="_blank">TOPOLOGICAL_HEART // MONOCHROME_MESH</a>

  <script>
    const canvas = document.getElementById('topological-heart');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 心臟 3D 拓撲參數化點陣生成
    const NUM_U = 60; // 緯度線數量
    const NUM_V = 40; // 經度線數量
    let points = [];

    function generateHeartMesh() {
      points = [];
      for (let i = 0; i <= NUM_U; i++) {
        let u = (i / NUM_U) * Math.PI;
        let row = [];
        for (let j = 0; j <= NUM_V; j++) {
          let v = (j / NUM_V) * 2 * Math.PI;

          // 立體心臟參數化數學模型
          let x = 16 * Math.pow(Math.sin(u), 3) * Math.cos(v);
          let y = -(13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u));
          let z = 16 * Math.pow(Math.sin(u), 3) * Math.sin(v);

          // 添加主動脈與大血管的拓撲分層拉伸感
          if (u < Math.PI * 0.2) {
            let tubeFactor = (Math.PI * 0.2 - u) * 15;
            x += Math.sin(v * 2) * tubeFactor * 0.3;
            y -= tubeFactor * 1.2;
            z += Math.cos(v * 2) * tubeFactor * 0.3;
          }

          row.push({ x, y, z, baseU: u, baseV: v });
        }
        points.push(row);
      }
    }

    generateHeartMesh();

    // 動態旋轉與心跳參數
    let angleY = 0;
    let time = 0;

    function render() {
      // 保持純黑背景，帶微弱拖尾效果增強動態韻律感
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.fillRect(0, 0, width, height);

      time += 0.04;
      angleY += 0.008; // 自轉速度

      // 擬真雙重心跳（Systole & Diastole 週期性搏動）
      let beat = Math.sin(time) * 0.5 + Math.sin(time * 2) * 0.2;
      let scale = (Math.min(width, height) / 60) * (1 + beat * 0.08);

      let projectedPoints = [];

      // 1. 進行 3D 旋轉與心跳形變計算
      for (let i = 0; i < points.length; i++) {
        let projectedRow = [];
        for (let j = 0; j < points[i].length; j++) {
          let p = points[i][j];

          // 搏動張力形變
          let pulse = 1 + beat * 0.12 * Math.sin(p.baseU * 3);
          let px = p.x * pulse;
          let py = p.y * pulse;
          let pz = p.z * pulse;

          // 繞 Y 軸旋轉
          let rx = px * Math.cos(angleY) + pz * Math.sin(angleY);
          let ry = py;
          let rz = -px * Math.sin(angleY) + pz * Math.cos(angleY);

          // 微幅度俯視傾角（繞 X 軸）
          let rotX = 0.25;
          let finalY = ry * Math.cos(rotX) - rz * Math.sin(rotX);
          let finalZ = ry * Math.sin(rotX) + rz * Math.cos(rotX);

          // 透視投影 (Perspective Projection)
          let distance = 80;
          let fov = 350 / (distance + finalZ);
          let screenX = width / 2 + rx * scale * (fov / 5);
          let screenY = height / 2 + finalY * scale * (fov / 5);

          // 深度透明度控制（模擬影片中透視脈絡與線條重疊感）
          let alpha = Math.max(0.08, Math.min(0.85, (finalZ + 35) / 70));

          projectedRow.push({ x: screenX, y: screenY, z: finalZ, alpha: alpha });
        }
        projectedPoints.push(projectedRow);
      }

      // 2. 繪製拓撲線網（純白線條，利用 Alpha 代表深度）
      ctx.lineWidth = 0.8;

      // 繪製橫向環線 (U - Latitudinal rings)
      for (let i = 0; i < projectedPoints.length; i += 1) {
        for (let j = 0; j < projectedPoints[i].length - 1; j++) {
          let p1 = projectedPoints[i][j];
          let p2 = projectedPoints[i][j + 1];

          ctx.beginPath();
          ctx.strokeStyle = `rgba(255, 255, 255, ${(p1.alpha + p2.alpha) / 2})`;
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }

      // 繪製縱向縱流線 (V - Longitudinal lines)
      for (let j = 0; j < NUM_V; j += 2) {
        for (let i = 0; i < projectedPoints.length - 1; i++) {
          let p1 = projectedPoints[i][j];
          let p2 = projectedPoints[i + 1][j];

          ctx.beginPath();
          ctx.strokeStyle = `rgba(255, 255, 255, ${(p1.alpha + p2.alpha) * 0.3})`; // 縱線微弱，凸顯層次
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.stroke();
        }
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
