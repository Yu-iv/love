<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Topological Heart - Monochromatic Art</title>
  <style>
    * { margin: 0; padding: 0; background-color: #0d0d0d; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    canvas { background: #0d0d0d; filter: contrast(1.2); }
  </style>
</head>
<body>

<canvas id="heartCanvas" width="600" height="600"></canvas>

<script>
  const canvas = document.getElementById('heartCanvas');
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  const cx = width / 2;
  const cy = height / 2;

  // 生成三維拓撲心形點雲
  const points = [];
  const numPoints = 1200;

  for (let i = 0; i < numPoints; i++) {
    const u = Math.PI * (Math.random() * 2 - 1);
    const v = (Math.PI / 2) * (Math.random() * 2 - 1);
    
    // 拓撲心型 Parametric Heart Formula
    let x = 16 * Math.pow(Math.sin(u), 3);
    let y = -(13 * Math.cos(u) - 5 * Math.cos(2*u) - 2 * Math.cos(3*u) - Math.cos(4*u));
    let z = v * 10;

    // 稍微加入立體縱深扭轉
    x += Math.sin(v) * 4;
    y += Math.cos(v) * 4;

    points.push({ x, y, z, baseZ: z });
  }

  let angleY = 0;
  let pulse = 0;

  function render() {
    ctx.fillStyle = 'rgba(13, 13, 13, 0.2)'; // 留白餘暉（Motion Blur）
    ctx.fillRect(0, 0, width, height);

    angleY += 0.015;
    pulse += 0.05;
    const scaleFactor = 1 + Math.sin(pulse) * 0.08; // 模擬心跳微幅搏動

    // 畫出粒子與極簡幾何連線
    for (let i = 0; i < points.length; i++) {
      let p = points[i];

      // Y 軸旋轉
      let x1 = p.x * Math.cos(angleY) - p.z * Math.sin(angleY);
      let z1 = p.x * Math.sin(angleY) + p.z * Math.cos(angleY);
      let y1 = p.y;

      // 心跳伸縮
      x1 *= scaleFactor;
      y1 *= scaleFactor;

      // 透視投影
      const perspective = 300 / (300 + z1);
      const px = cx + x1 * 12 * perspective;
      const py = cy + y1 * 12 * perspective;
      const alpha = Math.max(0.1, (z1 + 30) / 60);

      // 繪製微小單色粒子
      ctx.fillStyle = `rgba(240, 240, 240, ${alpha})`;
      ctx.beginPath();
      ctx.arc(px, py, 1 * perspective, 0, Math.PI * 2);
      ctx.fill();

      // 每隔幾個點連接線段，營造類似影片中的線框/網格拓撲感
      if (i % 8 === 0 && i + 1 < points.length) {
        const p2 = points[i + 1];
        let x2 = p2.x * Math.cos(angleY) - p2.z * Math.sin(angleY);
        let z2 = p2.x * Math.sin(angleY) + p2.z * Math.cos(angleY);
        let y2 = p2.y * scaleFactor;

        const pers2 = 300 / (300 + z2);
        const px2 = cx + x2 * 12 * pers2;
        const py2 = cy + y2 * 12 * pers2;

        ctx.strokeStyle = `rgba(200, 200, 200, ${alpha * 0.25})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px2, py2);
        ctx.stroke();
      }
    }

    requestAnimationFrame(render);
  }

  render();
</script>
</body>
</html>
