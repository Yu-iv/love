<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topological Heart - 拓撲幾何心臟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* 純黑背景 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        .ui-overlay {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #ffffff;
            pointer-events: none;
            z-index: 10;
        }
        .ui-overlay h1 {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-left: 2px solid #ffffff;
            padding-left: 10px;
            margin-bottom: 6px;
        }
        .ui-overlay p {
            font-size: 11px;
            color: #888888;
            letter-spacing: 1.5px;
            padding-left: 12px;
        }
    </style>
    <!-- 引入 Three.js 庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="ui-overlay">
        <h1>Topological Heart</h1>
        <p>GENUS-4 MANIFOLD / WIREFRAME MESH</p>
    </div>

    <div id="canvas-container"></div>

    <script>
        // 初始化場景、相機與渲染器
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); // 純黑

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // 建立群組包含心臟主體與管道結構
        const heartGroup = new THREE.Group();
        scene.add(heartGroup);

        // --- 1. 建立拓撲心臟主體 (幾何擬合) ---
        // 使用高密度細分的幾何體進行拓撲變形，模擬雙心室與心房管路
        const geometry = new THREE.IcosahedronGeometry(2.5, 30);
        const posAttribute = geometry.attributes.position;
        const vertex = new THREE.Vector3();

        // 變形算法：將球體變形成非愛心、符合生物拓撲的不對稱塊體
        for (let i = 0; i < posAttribute.count; i++) {
            vertex.fromBufferAttribute(posAttribute, i);

            // 拉長縱向 (Y軸)
            vertex.y *= 1.35;

            // 左/右心室不對稱偏置
            if (vertex.x < 0) {
                vertex.x *= 1.1; // 左心室壁較厚
            }
            
            // 底部心尖 (Apex) 錐形收束
            if (vertex.y < 0) {
                const factor = 1 + vertex.y * 0.25;
                vertex.x *= Math.max(0.2, factor);
                vertex.z *= Math.max(0.2, factor);
            }

            // 表面拓撲紋理 (螺旋狀肌纖維起伏)
            const angle = Math.atan2(vertex.z, vertex.x);
            const wave = Math.sin(angle * 4 + vertex.y * 2) * 0.08;
            vertex.x += vertex.x * wave;
            vertex.z += vertex.z * wave;

            posAttribute.setXYZ(i, vertex.x, vertex.y, vertex.z);
        }
        geometry.computeVertexNormals();

        // 線框材質（純白細線，高度透明感）
        const wireframeMaterial = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            wireframe: true,
            transparent: true,
            opacity: 0.12
        });
        const mainMesh = new THREE.Mesh(geometry, wireframeMaterial);
        heartGroup.add(mainMesh);

        // 點陣粒子材質（強化影片中的 CT / 點陣掃描質感）
        const pointsMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.025,
            transparent: true,
            opacity: 0.5
        });
        const mainPoints = new THREE.Points(geometry, pointsMaterial);
        heartGroup.add(mainPoints);

        // --- 2. 建立大血管出口 (主動脈/肺動脈 拓撲管道) ---
        function createVessel(radius, length, position, rotation) {
            const vesselGeo = new THREE.CylinderGeometry(radius, radius * 0.85, length, 16, 10, true);
            const vesselMesh = new THREE.Mesh(vesselGeo, wireframeMaterial);
            const vesselPoints = new THREE.Points(vesselGeo, pointsMaterial);

            const group = new THREE.Group();
            group.add(vesselMesh);
            group.add(vesselPoints);

            group.position.copy(position);
            group.rotation.set(rotation.x, rotation.y, rotation.z);
            return group;
        }

        // 主動脈 (Aorta)
        const aorta = createVessel(0.5, 2.2, new THREE.Vector3(-0.3, 2.8, 0.2), new THREE.Vector3(0.2, 0, -0.3));
        heartGroup.add(aorta);

        // 肺動脈 (Pulmonary Artery)
        const pulmonary = createVessel(0.45, 1.8, new THREE.Vector3(0.5, 2.6, 0.4), new THREE.Vector3(0.4, 0.2, 0.3));
        heartGroup.add(pulmonary);

        // 上腔靜脈 (Vena Cava)
        const venaCava = createVessel(0.35, 1.5, new THREE.Vector3(1.1, 2.3, -0.4), new THREE.Vector3(-0.1, 0, 0.2));
        heartGroup.add(venaCava);


        // --- 3. 心跳與動畫邏輯 ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // 1. 心跳律動（模擬雙重收縮：心房收縮 -> 心室收縮）
            const beatCycle = (elapsedTime * 1.2) % 1; // 心跳頻率
            let scale = 1.0;

            if (beatCycle < 0.15) {
                // 第一下主收縮
                scale = 1.0 + Math.sin(beatCycle / 0.15 * Math.PI) * 0.08;
            } else if (beatCycle > 0.2 && beatCycle < 0.35) {
                // 第二下次收縮
                scale = 1.0 + Math.sin((beatCycle - 0.2) / 0.15 * Math.PI) * 0.04;
            } else {
                // 舒張期
                scale = 1.0;
            }

            heartGroup.scale.set(scale, scale, scale);

            // 2. 緩慢自轉（呈現 3D 拓撲視角）
            heartGroup.rotation.y = elapsedTime * 0.25;
            heartGroup.rotation.x = Math.sin(elapsedTime * 0.15) * 0.1;

            renderer.render(scene, camera);
        }

        animate();

        // --- 4. 視窗縮放適應 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
