<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Standard Map Dynamics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        // 正交相機 (Orthographic Camera) 更有利於將 2D/3D 混沌相空間無形變地鋪滿全螢幕
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 全螢幕 Standard Map 粒子系統 ---
        const mapGroup = new THREE.Group();
        scene.add(mapGroup);

        // 大幅提升粒子數量以填滿全螢幕
        const NUM_ORBITS = 250;      // 軌道數量
        const STEPS_PER_ORBIT = 200; // 每條軌道的點數
        const TOTAL_POINTS = NUM_ORBITS * STEPS_PER_ORBIT;

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(TOTAL_POINTS * 3);

        // 初始化全螢幕涵蓋範圍的種子點
        const initialSeeds = [];
        for (let i = 0; i < NUM_ORBITS; i++) {
            initialSeeds.push({
                p: (Math.random() - 0.5) * Math.PI * 4,
                x: (Math.random() - 0.5) * Math.PI * 4
            });
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // 粒子材質
        const material = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.018,
            transparent: true,
            opacity: 0.55,
            blending: THREE.AdditiveBlending
        });

        const pointCloud = new THREE.Points(geometry, material);
        mapGroup.add(pointCloud);

        // --- 全螢幕演算方程 ---
        function updateStandardMap(K) {
            const posAttr = geometry.attributes.position;
            let ptr = 0;
            const aspect = window.innerWidth / window.innerHeight;

            // 根據螢幕寬高比計算動態拉伸比例，確保四周填滿
            const scaleX = (aspect > 1 ? aspect * 2.2 : 2.5) / Math.PI;
            const scaleY = (aspect > 1 ? 2.5 : (2.5 / aspect)) / Math.PI;

            for (let i = 0; i < NUM_ORBITS; i++) {
                let p = initialSeeds[i].p;
                let x = initialSeeds[i].x;

                for (let j = 0; j < STEPS_PER_ORBIT; j++) {
                    p = p + K * Math.sin(x);
                    x = x + p;

                    // 映射至連續空間並連續化（去掉 mod 2π 的突變邊界）
                    let pWrapped = ((p + Math.PI * 4) % (Math.PI * 8)) - Math.PI * 4;
                    let xWrapped = ((x + Math.PI * 4) % (Math.PI * 8)) - Math.PI * 4;

                    const posX = xWrapped * scaleX * 0.4;
                    const posY = pWrapped * scaleY * 0.4;
                    // 根據全螢幕座標算出的立體深度
                    const posZ = Math.sin(xWrapped * 0.5) * Math.cos(pWrapped * 0.5) * 1.2;

                    posAttr.setXYZ(ptr, posX, posY, posZ);
                    ptr++;
                }
            }
            posAttr.needsUpdate = true;
        }

        // --- 動畫與視覺律動 ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const t = clock.getElapsedTime();

            // K 值律動帶動全螢幕圖案的張力演化
            const K = 0.9 + Math.sin(t * 0.3) * 0.5;
            
            updateStandardMap(K);

            // 微幅的立體傾斜旋轉，增添深度感
            mapGroup.rotation.y = Math.sin(t * 0.1) * 0.15;
            mapGroup.rotation.x = Math.cos(t * 0.08) * 0.1;

            renderer.render(scene, camera);
        }

        animate();

        // 視窗縮放自動重算全螢幕範圍
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
