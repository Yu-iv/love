<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standard Map Dynamics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- Standard Map 粒子系統構建 ---
        const mapGroup = new THREE.Group();
        scene.add(mapGroup);

        const NUM_ORBITS = 180;      // 軌道數量
        const STEPS_PER_ORBIT = 180; // 每條軌道的迭代點數
        const TOTAL_POINTS = NUM_ORBITS * STEPS_PER_ORBIT;

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(TOTAL_POINTS * 3);

        // 初始化軌道種子點 (Seeds)
        const initialSeeds = [];
        for (let i = 0; i < NUM_ORBITS; i++) {
            initialSeeds.push({
                p: (Math.random() - 0.5) * Math.PI * 2,
                x: (Math.random() - 0.5) * Math.PI * 2
            });
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        // 點陣材質 (純白粒子)
        const material = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.022,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const pointCloud = new THREE.Points(geometry, material);
        mapGroup.add(pointCloud);

        // --- Standard Map 數學迭代方程 ---
        function updateStandardMap(K) {
            const posAttr = geometry.attributes.position;
            let ptr = 0;
            const TWO_PI = Math.PI * 2;

            for (let i = 0; i < NUM_ORBITS; i++) {
                let p = initialSeeds[i].p;
                let x = initialSeeds[i].x;

                for (let j = 0; j < STEPS_PER_ORBIT; j++) {
                    p = (p + K * Math.sin(x)) % TWO_PI;
                    x = (x + p) % TWO_PI;

                    let pNorm = p > Math.PI ? p - TWO_PI : (p < -Math.PI ? p + TWO_PI : p);
                    let xNorm = x > Math.PI ? x - TWO_PI : (x < -Math.PI ? x + TWO_PI : x);

                    const posX = xNorm * 0.9;
                    const posY = pNorm * 0.9;
                    const posZ = Math.cos(xNorm) * Math.sin(pNorm) * 0.8;

                    posAttr.setXYZ(ptr, posX, posY, posZ);
                    ptr++;
                }
            }
            posAttr.needsUpdate = true;
        }

        // --- 動畫與動態 K 值調節 ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const t = clock.getElapsedTime();

            // K 值律動
            const K = 0.8 + Math.sin(t * 0.4) * 0.6;
            
            updateStandardMap(K);

            // 三維旋轉
            mapGroup.rotation.y = t * 0.12;
            mapGroup.rotation.x = Math.sin(t * 0.08) * 0.2;

            renderer.render(scene, camera);
        }

        animate();

        // 視窗縮放適應
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
